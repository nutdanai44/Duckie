<main><header><b class="brand">🦆 ร้านซองจิ๋ว</b><span class="wallet" id="wallet"></span></header><nav id="nav" aria-label="เมนูเกม"></nav><section id="screen"></section><p id="notice" role="status"></p></main>
<script>
const ducks=['ถุงแกง','เสื้อกันฝน','ข้าวห่อใบตอง','กวาดร้าน','จ่ายตลาด','รถเข็นไอติม','หมูปิ้ง','ชาไทย','ร้อยมาลัย','นักชิม','ผัดไฟลุก','เชฟกระทะทอง'];
const items=[['รถเข็นไอติม','🍦'],['ป้ายตลาด','🪧'],['โต๊ะพับ','🪑'],['แก้วชาไทย','🧋'],['ถุงแกง','🥡'],['ตะกร้ามาลัย','🧺']];
const stories=[['ลูกค้าคนแรก','เป็ดไอติมตักไอติมให้ลูกค้าคนแรกของร้าน 🍨','วางเป็ดรถเข็นไอติม รถเข็นไอติม และเป็ดอีกหนึ่งตัว'],['ไข่ดาวเต็มสิบ','เชฟโยนไข่ดาวลงจาน นักชิมให้คะแนนเต็มสิบ! 🍳','วางเป็ดเชฟกระทะทองคู่เป็ดนักชิม']];
const key='duckie-market-v1';
let state={coins:90,packs:0,pity:0,stamps:0,ducks:[],items:[],stories:[],slots:[-1,-1,-1]};
try{const saved=localStorage.getItem(key);if(saved)state={...state,...JSON.parse(saved)}}catch{}
let tab=0,album=0,reveal=null,dragStart;
const byId=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};
const art=i=>'<div class="art" role="img" aria-label="เป็ด'+ducks[i]+'" style="--pos:'+((i%4)*100/3)+'% '+(Math.floor(i/4)*50)+'%"></div>';
const itemArt=i=>'<div class="prop" aria-hidden="true">'+items[i][1]+'</div>';
const rarity=i=>['Common','Rare','Epic','Legendary'][i<5?0:i<9?1:i<11?2:3];
const choose=list=>list[Math.floor(Math.random()*list.length)];
function draw(){
 if(state.coins<30)return;
 const roll=Math.random()*100;
 const demo=[[5,0],[0,1]][state.packs];
 const d=demo?.[0]??(state.pity===19||roll>=98?11:roll>=88?choose([9,10]):roll>=60?choose([5,6,7,8]):choose([0,1,2,3,4]));
 const i=demo?.[1]??choose([0,1,2,3,4,5]);
 const duplicates=Number(state.ducks.includes(d))+Number(state.items.includes(i));
 if(!state.ducks.includes(d))state.ducks.push(d);
 if(!state.items.includes(i))state.items.push(i);
 state.stamps+=duplicates;state.coins-=30;state.packs++;state.pity=d===11?0:state.pity+1;
 reveal={d,i,duplicates};save();render();byId('notice').textContent='เปิดได้เป็ด'+ducks[d]+' และ'+items[i][0];
}
function claim(){
 const [a,b,i]=state.slots;
 const matches=[i===0&&[a,b].includes(5)&&a>=0&&b>=0&&a!==b,[a,b].includes(11)&&[a,b].includes(9)];
 const index=matches.findIndex((match,j)=>match&&!state.stories.includes(j));
 if(index<0)return;
 state.stories.push(index);state.coins+=60;save();render();byId('notice').textContent=stories[index][1]+' รับ 60 เหรียญ';
}
function card(i,type,owned){
 const label=type===0?'เป็ด'+ducks[i]:type===1?items[i][0]:stories[i][0];
 const visual=type===0?art(i):type===1?itemArt(i):'<div class="prop">'+(i===0?'🍨':'🍳')+'</div>';
 return '<article class="card">'+(owned?visual:'<div class="locked" aria-label="ยังไม่สะสม">?</div>')+'<b>'+label+'</b><small>'+(type===0?rarity(i):type===2?(owned?stories[i][1]:stories[i][2]):owned?'สะสมแล้ว':'ยังไม่สะสม')+'</small>'+(!owned&&type<2&&state.stamps>=3?'<p><button data-exchange="'+i+'">แลก 3 แสตมป์</button></p>':'')+'</article>';
}
function render(){
 byId('wallet').textContent='🪙 '+state.coins+' เหรียญ · '+state.stamps+' แสตมป์';
 byId('nav').innerHTML=['เปิดซอง','จัดร้าน','สมุดสะสม'].map((name,i)=>'<button data-tab="'+i+'" aria-pressed="'+(tab===i)+'" class="'+(tab===i?'active':'')+'">'+name+'</button>').join('');
 const screen=byId('screen');
 if(tab===0){
 const result=reveal?'<div class="reveal">'+card(reveal.d,0,true)+card(reveal.i,1,true)+'</div>':'<button class="pack" id="pack" aria-label="ฉีกซองตลาดเช้า" '+(state.coins<30?'disabled':'')+'><strong>ตลาดเช้า</strong>'+art(5)+'<span>ลากหรือแตะเพื่อฉีกซอง</span></button>';
 screen.innerHTML='<div class="hero"><div class="copy"><span class="tag">เป็ด '+state.ducks.length+'/12 · ของ '+state.items.length+'/6</span><h1>ตลาดเช้า<br>หน้าบ้าน</h1><p>'+(reveal?(reveal.duplicates?'ได้ของซ้ำ รับ '+reveal.duplicates+' แสตมป์':'ได้ของสะสมใหม่!'):'ในแต่ละซองมีเป็ด 1 ตัวและของแต่งร้าน 1 ชิ้น')+'</p><button class="action" id="draw" '+(state.coins<30?'disabled':'')+'>'+ (reveal?'เปิดอีกซอง':'เปิดซอง')+' · 30 เหรียญ</button> '+(reveal?'<button data-tab="1">ไปจัดร้าน</button>':'')+ (state.coins<30?'<p><button id="work">ช่วยเก็บร้าน รับ 30 เหรียญ</button></p>':'')+'<details><summary>อัตราสุ่มและการันตี</summary><p>สองซองแรกมีของสำหรับลองฉากร้านไอติม หลังจากนั้น Common 60% · Rare 28% · Epic 10% · Legendary 2% การันตี Legendary เมื่อพลาดติดกัน 19 ซอง ของแต่ละแบบมีโอกาสเท่ากัน</p></details></div><div class="stage">'+result+'</div></div>';
 byId('draw').onclick=draw;
 if(byId('work'))byId('work').onclick=()=>{state.coins+=30;save();render();byId('notice').textContent='รับ 30 เหรียญแล้ว'};
 const pack=byId('pack');
 if(pack){pack.onclick=draw;pack.onpointerdown=e=>{dragStart=e.clientX;pack.setPointerCapture(e.pointerId)};pack.onpointerup=e=>{if(Math.abs(e.clientX-dragStart)>32)draw()};}
 }
 if(tab===1){
 const [a,b,i]=state.slots;
 const match=((i===0&&[a,b].includes(5)&&a>=0&&b>=0&&a!==b&&!state.stories.includes(0))||([a,b].includes(11)&&[a,b].includes(9)&&!state.stories.includes(1)));
 const select=(slot,ids,labels,title)=>'<label>'+title+'<select data-slot="'+slot+'"><option value="-1">ยังไม่วาง</option>'+ids.map(id=>'<option value="'+id+'" '+(state.slots[slot]===id?'selected':'')+'>'+labels[id]+'</option>').join('')+'</select></label>';
 screen.innerHTML='<div class="panel"><h1>จัดมุมร้าน</h1><p>วางเป็ดสองตัวและเลือกของแต่งร้านเพื่อค้นหาฉาก</p><div class="scene">'+(a>=0?art(a):'🪹')+(i>=0?itemArt(i):'')+(b>=0?art(b):'🪹')+'</div><div class="fields">'+select(0,state.ducks.filter(x=>x!==b),ducks,'เป็ดตัวแรก')+select(1,state.ducks.filter(x=>x!==a),ducks,'เป็ดตัวที่สอง')+select(2,state.items,items.map(x=>x[0]),'ของแต่งร้าน')+'</div><p><button class="action" id="claim" '+(match?'':'disabled')+'>บันทึกฉากลงอัลบั้ม</button></p><details><summary>ใบ้ฉากพิเศษ</summary>'+stories.map(s=>'<p><b>'+s[0]+'</b> · '+s[2]+'</p>').join('')+'</details></div>';
 byId('claim').onclick=claim;
 screen.querySelectorAll('select').forEach(el=>el.onchange=()=>{const slot=el.dataset.slot;state.slots[slot]=Number(el.value);save();render();screen.querySelector('[data-slot="'+slot+'"]').focus()});
 }
 if(tab===2){
 const groups=[ducks,items,stories],owned=[state.ducks,state.items,state.stories];
 screen.innerHTML='<div class="line"><h1>สมุดสะสม</h1><span>ของซ้ำสะสมไว้แลกชิ้นที่ขาดได้</span></div><nav aria-label="หมวดสะสม">'+['เป็ด','ของ','ภาพเหตุการณ์'].map((s,i)=>'<button data-album="'+i+'" aria-pressed="'+(album===i)+'" class="'+(album===i?'active':'')+'">'+s+' '+owned[i].length+'/'+groups[i].length+'</button>').join('')+'</nav><div class="cards">'+groups[album].map((_,i)=>card(i,album,owned[album].includes(i))).join('')+'</div>';
 }
}
document.querySelector('main').addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.dataset.tab!==undefined){tab=Number(button.dataset.tab);byId('notice').textContent='';render();return}
 if(button.dataset.album!==undefined){album=Number(button.dataset.album);render();return}
 if(button.dataset.exchange!==undefined){
 const ids=album===0?state.ducks:state.items;const id=Number(button.dataset.exchange);
 if(state.stamps>=3&&!ids.includes(id)){state.stamps-=3;ids.push(id);save();render();byId('notice').textContent='แลกของสะสมแล้ว'}
 }
});
render();
</script></html>
